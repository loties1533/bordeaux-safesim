<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BORDEAUX | SAFE-SIM WAR ROOM</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; height: 100vh !important; width: 100vw !important; z-index: 0; background: #020617; }
        .leaflet-container { background: #020617 !important; }
        .custom-scroll::-webkit-scrollbar { width: 2px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #10b981; }
    </style>
</head>
<body class="bg-slate-950 text-emerald-400 font-mono overflow-hidden">

    <div class="absolute top-0 left-0 w-full h-full pointer-events-none z-[1001] border-[20px] border-emerald-500/5 opacity-20 hidden md:block"></div>

    <aside id="controls" class="absolute top-6 left-6 z-[1000] w-80 bg-slate-900/90 backdrop-blur-lg border border-emerald-500/30 p-6 rounded-sm shadow-[0_0_20px_rgba(16,185,129,0.2)]">
        
        <header class="mb-6 border-b border-emerald-500/50 pb-2">
            <div class="flex justify-between items-center">
                <h1 class="text-xl font-bold tracking-tighter uppercase italic text-emerald-500">
                    Moniteur de crise
                </h1>
                <span class="text-[8px] bg-emerald-500 text-slate-900 px-1 font-bold">LIVE</span>
            </div>
            <p class="text-[10px] text-slate-500 uppercase tracking-widest mt-1">Bordeaux Métropole - Simulation Crue</p>
        </header>

        <div class="mb-8">
            <div class="flex justify-between mb-2">
                <label class="text-xs uppercase font-bold text-emerald-500">Niveau Garonne (NGF)</label>
                <span id="slider-val" class="text-white font-bold bg-emerald-900 px-2 tracking-widest border border-emerald-500/50">0.0m</span>
            </div>
            <input type="range" id="crisis-slider" min="0" max="15" step="0.1" value="0" class="w-full cursor-pointer accent-emerald-500">
        </div>

        <div class="space-y-4">
            <div class="bg-slate-800/30 p-3 border-l-2 border-emerald-500">
                <p class="text-[10px] uppercase text-slate-400 mb-1">Impact Population</p>
                <div class="flex items-end justify-between">
                    <span id="stat-survival" class="text-3xl font-bold text-white">0.0%</span>
                    <span id="stat-impacted" class="text-[10px] text-emerald-600 font-bold text-right">0 hab. impactés</span>
                </div>
                <div class="w-full bg-slate-700 h-[2px] mt-2">
                    <div id="survival-bar" class="bg-emerald-500 h-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <div id="transport-card" class="bg-slate-800/30 p-3 border-l-2 border-emerald-500">
                <p class="text-[10px] uppercase text-slate-400 mb-1">Réseau Transports TBM</p>
                <div id="transport-status" class="text-lg font-bold text-emerald-400">NORMAL</div>
                <div id="lignes-hs-list" class="text-[9px] text-slate-500 mt-1 leading-tight custom-scroll max-h-16 overflow-y-auto italic">Trafic nominal</div>
            </div>

            <div id="lieux-card" class="bg-slate-800/30 p-3 border-l-2 border-emerald-500">
                <p class="text-[10px] uppercase text-slate-400 mb-1">Lieux publics isolés</p>
                <div id="lieux-count" class="text-2xl font-bold text-white leading-none">0</div>
                <div id="lieux-list" class="text-[9px] text-slate-500 mt-2 leading-tight custom-scroll max-h-24 overflow-y-auto">Zone sécurisée</div>
            </div>
        </div>

        <footer class="mt-6 pt-4 border-t border-emerald-500/20">
            <div class="flex justify-between text-[8px] text-slate-600 uppercase font-bold tracking-widest">
                <span>Status: Système Actif</span>
                <span>v2.0_clean</span>
            </div>
        </footer>
    </aside>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/js/map.js"></script>
    <script src="/static/js/simulator.js"></script>

</body>
</html>
