<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Safe-City | Simulation</title>
    <link rel="icon" type="image/svg+xml" href="/static/icons/logo.svg">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <a href="/" class="btn-nav">
        <svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Retour au menu
    </a>

    <aside id="controls" class="glass-panel">
        <h1 class="text-3xl font-bold text-white mb-1 font-title">Simulation</h1>
        <p class="text-[10px] text-slate-400 uppercase tracking-widest mb-10">Niveau Fleuve Garonne (NGF)</p>

        <div class="mb-12">
            <div class="flex justify-between items-end">
                <span class="text-slate-400 text-sm font-light italic">Garonne</span>
                <span id="slider-val" class="text-4xl font-light text-emerald-400">0.0m</span>
            </div>
            <input type="range" id="crisis-slider" min="0" max="15" step="0.1" value="0">
        </div>

        <div class="pt-8 border-t border-white/10">
            <p class="text-[10px] text-slate-500 uppercase tracking-widest mb-4">Diagnostic d'impact</p>
            <div id="stat-survival" class="text-5xl font-light text-white mb-2 tracking-tighter">0%</div>
            <div id="stat-impacted" class="text-xs text-emerald-400/80 font-medium uppercase">Population en sécurité</div>
            <div class="w-full bg-white/5 h-1.5 rounded-full overflow-hidden mt-6">
                <div id="survival-bar" class="bg-emerald-500 h-full transition-all duration-1000"></div>
            </div>
        </div>
    </aside>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/js/map.js"></script>
    <script src="/static/js/simulator.js"></script>
</body>
</html>
