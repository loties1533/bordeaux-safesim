<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BORDEAUX | SAFE-SIM WAR ROOM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-slate-950 text-emerald-400 font-mono overflow-hidden">

    <div id="ui-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none z-[1001] border-[20px] border-emerald-500/5 opacity-20 hidden md:block"></div>

    <aside id="controls" class="absolute top-6 left-6 z-[1000] w-80 bg-slate-900/90 backdrop-blur-lg border border-emerald-500/30 p-6 rounded-sm shadow-[0_0_20px_rgba(16,185,129,0.2)] pointer-events-auto">
        <header class="mb-6 border-b border-emerald-500/50 pb-2">
            <h1 class="text-xl font-bold tracking-tighter uppercase italic">Crisis-Monitor <span class="text-xs align-top text-emerald-600 underline">v1.0</span></h1>
            <p class="text-[10px] text-slate-500 uppercase tracking-widest">Secteur : Bordeaux Métropole</p>
        </header>

        <div class="mb-8">
            <div class="flex justify-between mb-2">
                <label class="text-xs uppercase font-bold text-emerald-500">Niveau Alerte Garonne</label>
                <span id="slider-val" class="text-white font-bold bg-emerald-900 px-2 leading-tight tracking-widest">0.0m</span>
            </div>
            <input type="range" id="crisis-slider" min="0" max="7" step="0.5" value="0" 
                   class="w-full h-1 bg-slate-700 appearance-none cursor-pointer accent-emerald-500 hover:accent-red-500 transition-colors">
            <div class="flex justify-between text-[9px] mt-1 text-slate-500">
                <span>STABLE</span>
                <span>CRITIQUE</span>
            </div>
        </div>

        <div class="space-y-4">
            <div class="bg-slate-800/50 p-3 border-l-2 border-emerald-500">
                <p class="text-[10px] uppercase text-slate-400">Capacité Survie</p>
                <div class="flex items-end justify-between">
                    <span id="stat-survival" class="text-2xl font-bold text-white tracking-tighter">100%</span>
                    <span id="stat-impacted" class="text-xs text-emerald-600">0 Impactés</span>
                </div>
                <div class="w-full bg-slate-700 h-[2px] mt-2">
                    <div id="survival-bar" class="bg-emerald-500 h-full transition-all duration-700" style="width: 100%"></div>
                </div>
            </div>
        </div>
    </aside>

    <div id="map" class="h-screen w-screen grayscale-[0.5] contrast-[1.2]"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/js/map.js"></script>
    <script src="/static/js/simulator.js"></script>
</body>
</html>
