<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Îlots de Chaleur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/logo.svg') }}">
</head>
<body>
    <div id="map"></div>

    <a href="/" class="btn-nav">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        Retour au menu
    </a>

    <aside class="glass-panel">
        <h2 class="font-title text-3xl font-bold mb-2">Thermique</h2>
        <p class="text-gray-300 text-sm mb-6 pb-4 border-b border-gray-600/50">
            Analyse des écarts de températures métropolitains.
        </p>

        <div class="flex flex-col gap-4">
            <div class="flex items-center gap-3">
                <div class="w-4 h-4 rounded-full bg-orange-400 shadow-[0_0_10px_rgba(251,146,60,0.5)]"></div>
                <span class="text-sm font-medium">Îlots de chaleur urbains</span>
            </div>
            <div class="flex items-center gap-3">
                <div class="w-4 h-4 rounded-full bg-sky-400 shadow-[0_0_10px_rgba(56,189,248,0.5)]"></div>
                <span class="text-sm font-medium">Zones de fraîcheur</span>
            </div>
        </div>
        
        <p class="text-xs text-gray-400 mt-8 italic">
            Données issues du diagnostic climatique de Bordeaux Métropole.
        </p>
    </aside>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="{{ url_for('static', filename='js/heat_logic.js') }}"></script>

</html>
